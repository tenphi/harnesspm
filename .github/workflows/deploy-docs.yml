name: Deploy docs site to GitHub Pages

# Builds https://harnesspm.tenphi.me with Cookbook (docs.config.ts) and
# publishes it through GitHub Pages. The custom domain is set in the
# repository's Pages settings: an Actions deployment ignores a CNAME file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history, so each page's "last updated" date comes from git.
          fetch-depth: 0

      # Cookbook needs Node 22.19 or later.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the docs site
        run: npm run build:docs

      - name: Check the built site
        run: npm run docs:check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # npm run build writes the CLI to dist/, so the site builds into site-dist/.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
